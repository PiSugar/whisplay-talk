[env:m5stack-atoms3]
platform = espressif32@7.1.3
board = m5stack-atoms3
framework = arduino
monitor_speed = 115200
upload_speed = 921600
lib_deps =
    https://github.com/m5stack/M5Unified.git#e79eb6e3137a41e50b0ec23c8c38738bdb3a11e2
    https://github.com/m5stack/M5Atomic-EchoBase.git#bf4b610495c5499ecece46a23f6fd446de19284a
    https://github.com/pschatzmann/arduino-libopus.git#bae0f8570b03071d0101445059e7178bed8bd144
build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    -DCORE_DEBUG_LEVEL=3
    -DWHISPLAY_DEVICE_NAME=\"atomic-s3\"
    -DWHISPLAY_ESPNOW_CHANNEL=2
